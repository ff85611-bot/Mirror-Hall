    const state = {
      mouse: new THREE.Vector2(0,0),
      targetZ: 0, currentZ: 0,
      clickTime: -999.0,
    };
    window.addEventListener('mousemove', e => {
      state.mouse.set((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
    });
    window.addEventListener('wheel', e => { state.targetZ += e.deltaY*.018; });
    const flash = document.getElementById('flash');
    window.addEventListener('click', () => {
      state.clickTime = performance.now()*.001;
      flash.classList.add('active');
      setTimeout(()=>flash.classList.remove('active'), 80);
    });

    /* ════════════════════════════════════════════════════════════
       FRAGMENT SHADER — Mirror Hall Environment Integration
    ════════════════════════════════════════════════════════════ */
    const frag = `
precision highp float;
uniform float      uTime;
uniform vec2       uResolution;
uniform vec2       uMouse;
uniform float      uCameraZ;
uniform float      uClickTime;
uniform sampler2D  uEnvMap;
varying vec2       vUv;

#define PI 3.14159265359
#define TWO_PI 6.28318530718

/* ── MATH ─────────────────────────────────────────────────── */
mat2 rot2(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }

/* ── NOISE ────────────────────────────────────────────────── */
float hash(float n){ return fract(sin(n)*43758.5453); }
float hash2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec3 p){
  vec3 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float n=i.x+i.y*57.+113.*i.z;
  return mix(mix(mix(hash(n),hash(n+1.),f.x),mix(hash(n+57.),hash(n+58.),f.x),f.y),
             mix(mix(hash(n+113.),hash(n+114.),f.x),mix(hash(n+170.),hash(n+171.),f.x),f.y),f.z);
}
float fbm(vec3 p){ return vnoise(p)*.5+vnoise(p*2.01)*.25+vnoise(p*4.03)*.125; }

/* ── ENV MAP SAMPLING ─────────────────────────────────────── */
/* Equirectangular spherical projection on direction vector d  */
vec3 sampleEnv(vec3 d){
  vec3 dn = normalize(d);
  /* Slight time-driven rotation to animate reflections */
  dn.xz *= rot2(uTime * 0.018);
  float u = atan(dn.z, dn.x) / TWO_PI + 0.5;
  float v = acos(clamp(dn.y, -1.0, 1.0)) / PI;
  vec3 col = texture2D(uEnvMap, vec2(u, v)).rgb;
  return col;
}

/* ── GLOBALS ──────────────────────────────────────────────── */
vec3 g_ro, g_fwd;
float pulse(float t){ return pow(max(0., sin(t*2.18)), 3.); }

/* ── MOUSE / CLICK FIELD ─────────────────────────────────── */
float mouseField(vec3 p){
  vec3  dp   = p - g_ro;
  float proj = max(0., dot(dp, g_fwd));
  float dist = length(dp - g_fwd*proj);
  float suction = exp(-dist*dist*1.3)*0.72;
  float ripple  = 0.;
  float dt = uTime - uClickTime;
  if(dt>0. && dt<4.8){
    float front = dt*5.0;
    float wd    = abs(dist-front);
    ripple = exp(-wd*wd*2.2)*exp(-dt*.9)*sin(dist*5.5-dt*10.)*1.5;
  }
  return suction+ripple;
}

/* ── SDF ─────────────────────────────────────────────────── */
float map(vec3 p){
  float t=uTime;
  float warp=fbm(vec3(p.xy*.14,p.z*.06+t*.045));
  vec3 tp=p;
  tp.xy+=vec2(sin(p.z*.22+t*.11)*1.65+sin(p.z*.08)*.85,
              cos(p.z*.17+t*.09)*1.42+cos(p.z*.12)*.72);
  tp.xy*=rot2(p.z*.088+t*.021);
  float breathe=sin(t*1.28)*.38+sin(t*2.18+.75)*.19;
  float bump=fbm(vec3(tp.xy*.52,p.z*.13+t*.032))*.52;

  // ─── 關鍵機制：設定隧道的盡頭深度 ───
  float tunnelEnd = 150.0; // 這是出口的深度座標，數值越小越快走到盡頭
  // 當 p.z 進入 (tunnelEnd - 30.0) 到 tunnelEnd 的區間時，數值會從 0 平滑過渡到 1
  float openUp = smoothstep(tunnelEnd - 30.0, tunnelEnd, p.z); 

  // 計算基礎管壁半徑，並在接近盡頭時，將半徑急遽放大到 100.0，形成「出口」
  float baseRadius = 5.75+breathe+warp*.52+bump;
  float finalRadius = mix(baseRadius, 100.0, openUp);
  float tunnel = finalRadius - length(tp.xy);

  // 讓內部的血管與障礙球體，隨著接近出口而逐漸萎縮消失
  float obstacleScale = 1.0 - openUp;

  float blobs=99.;
  for(int i=0;i<3;i++){
    float fi=float(i), ph=fi*2.094;
    float lz=mod(p.z-fi*8.2,18.)-9.;
    vec2 bxy=vec2(sin(p.z*.25+ph+t*.21)*1.85,cos(p.z*.19+ph+t*.17)*1.60);
    // 乘上 obstacleScale，抵達盡頭時半徑歸零
    float blobR = (0.50+sin(t*1.55+ph)*.16) * obstacleScale; 
    blobs=smin(blobs, length(vec3(p.xy-bxy,lz))-blobR, 1.15);
  }
  float veins=99.;
  for(int i=0;i<3;i++){
    float fi=float(i);
    float ang=p.z*.10+fi*2.094+t*.036;
    vec2 vc=vec2(cos(ang),sin(ang))*4.35+vec2(sin(p.z*.18+fi)*.4,cos(p.z*.14+fi+1.)*.3);
    // 同樣乘上 obstacleScale
    float veinR = (0.20+sin(t*1.85+fi*2.1+p.z*.25)*.065) * obstacleScale;
    veins=smin(veins, length(p.xy-vc)-veinR, 0.55);
  }
  return smin(smin(tunnel,blobs,1.45),veins,0.80)-mouseField(p);
}

/* ── NORMAL ───────────────────────────────────────────────── */
vec3 calcNormal(vec3 p){
  const float e=0.004;
  return normalize(vec3(
    map(p+vec3(e,0,0))-map(p-vec3(e,0,0)),
    map(p+vec3(0,e,0))-map(p-vec3(0,e,0)),
    map(p+vec3(0,0,e))-map(p-vec3(0,0,e))));
}

/* ── SHADING — Environment-Integrated ────────────────────── */
vec3 shade(vec3 p, vec3 N, vec3 V, vec3 rd, float depth){
  float t=uTime;

  /* ── Organic surface colour ── */
  float cn1=fbm(p*.21);
  float cn2=fbm(p*.46+vec3(3.1,7.4,2.2));
  float cn3=fbm(p*.9 +vec3(1.3,0.5,5.7));
  vec3 col=mix(vec3(.38,.01,.01),vec3(.10,.03,.20),cn1);
  col=mix(col,vec3(.04,.16,.03),cn2*.28);
  col+=vec3(.14,.0,.0)*pulse(t);

  /* ── Env-map reflection ── */
  vec3 R = reflect(rd, N);
  /* Add procedural micro-ripple to reflection vector (mucus shiver) */
  float rippleMag = 0.06 + 0.04*sin(t*3.2 + p.z*.8);
  R.xy += vec2(fbm(p*.8+t*.18), fbm(p*.8+t*.18+vec3(5.))) * rippleMag;
  R = normalize(R);
  vec3 envCol = sampleEnv(R);

  /* Redness tint: environment adopts the organic colour temperature */
  envCol = mix(envCol, envCol * vec3(1.6, 0.4, 0.3), 0.6);

  /* ── Fresnel (Schlick) — controls how mirror-like the surface is ── */
  float cosTheta = max(0., dot(N, V));
  float F0       = 0.18;                       /* base reflectivity */
  float fresnel  = F0 + (1.0-F0)*pow(1.0-cosTheta, 4.0);
  /* Wet organic boost: veiny areas more reflective */
  fresnel *= (1.0 + cn1*.4);

  /* ── Direct lighting from env image (sample env at light dir) ── */
  vec3 L = normalize(vec3(sin(t*.42)*2., cos(t*.35), -1.25));
  float NdL = max(0., dot(N, -L));
  /* Env-sampled diffuse: bleed the red corridor into the tissue */
  vec3 envDiff = sampleEnv(-L) * 1.4;

  /* ── Specular ── */
  vec3  H    = normalize(-L + V);
  float NdH  = max(0., dot(N, H));
  vec3 specCol = vec3(1.,.65,.50)*pow(NdH,90.)*3.5
               + vec3(.5,.1,.06)*pow(NdH,12.)*.9;

  /* ── Subsurface scattering ── */
  float sss = pow(max(0., -dot(V, N)), 5.5);
  vec3 sssCol = vec3(.70,.02,.0)*sss*.55;

  /* ── Rim ── */
  float rim = pow(1.-max(0.,dot(N,V)), 4.2);
  vec3 rimCol = vec3(.90,.18,.02)*rim*.70*(0.5+0.5*pulse(t));
  /* Rim picks up env colour (red corridor edge glow) */
  rimCol += sampleEnv(R)*rim*.25;

  /* ── Ambient occlusion ── */
  float ao = 0.3 + 0.7*(clamp(map(p+N*.35)/.35,0.,1.)*.6
                       +clamp(map(p+N*.80)/.80,0.,1.)*.4);
  ao = ao*ao;

  /* ── Combine: diffuse + env reflection (Fresnel weighted) ── */
  vec3 diffuse  = col * (envDiff * NdL * 1.4 + vec3(.04,.0,.01)*0.3);
  vec3 reflect_ = envCol * fresnel * 2.2;

  return (diffuse + reflect_ + sssCol)*ao + specCol + rimCol;
}

/* ── MAIN ─────────────────────────────────────────────────── */
void main(){
  vec2 uv=(vUv-.5)*2.; uv.x*=uResolution.x/uResolution.y;

  /* Camera */
  vec3 ro=vec3(0.,0.,uCameraZ); g_ro=ro;
  vec3 rd=normalize(vec3(uv,1.3));
  rd.xz*=rot2(uMouse.x*3.14159);
  rd.yz*=rot2(uMouse.y*1.22);
  g_fwd=vec3(0.,0.,1.);
  g_fwd.xz*=rot2(uMouse.x*3.14159);
  g_fwd.yz*=rot2(uMouse.y*1.22);

  /* ── Raymarch ── */
  float t=0.05; vec3 p; bool hit=false;
  for(int i=0;i<95;i++){
    p=ro+rd*t;
    float d=map(p);
    if(abs(d)<0.005){ hit=true; break; }
    if(t>58.) break;
    t+=d*.52;
  }

  vec3 color=vec3(0.);

  if(hit){
    vec3 N=calcNormal(p);
    color=shade(p,N,-rd,rd,t);

    /* ── Organic fog mixed with env-image colour ── */
    /* Sample env in the forward direction for fog tint */
    vec3 fogEnv = sampleEnv(rd) * 0.35;
    vec3 fogCol  = mix(vec3(.055,.0,.022), fogEnv, .55);
    float fogAmt = 1.-exp(-t*.042);
    color=mix(color, fogCol, fogAmt);

    /* ── Vignette ── */
    float vig=smoothstep(.90,.05,length(vUv-.5)*2.);
    color*=.35+.65*vig;

    /* ── Near-surface tissue glow ── */
    float glow=exp(-abs(map(p+N*.1))*8.)*.07;
    color+=vec3(.55,.04,.02)*glow*pulse(uTime);

  } else {
    /* ── Sky: pure spherical env-map projection on rd ── */
    vec3 envBg = sampleEnv(rd);
    /* Darken towards edges for depth illusion */
    float edgeDark = 1.0 - length(uv)*.28;
    envBg *= edgeDark * 1.6;
    /* Subtle pulsing heat-glow at the vanishing point */
    float axialDot = max(0., dot(normalize(rd), g_fwd));
    envBg += vec3(.15,.01,.0)*pow(axialDot, 8.0)*(0.6+0.4*pulse(uTime));
    color = envBg;
  }

  /* ── Film grain ── */
  color += (hash2(vUv+fract(uTime*.09))-.5)*.020;

  /* ── ACES tone map ── */
  color=color*(2.51*color+.03)/(color*(2.43*color+.59)+.14);
  color=clamp(color,0.,1.);

  /* ── Slight desaturation (aged flesh) ── */
  float lum=dot(color,vec3(.299,.587,.114));
  color=mix(color,vec3(lum),.07);

  /* ── Chromatic aberration (edges) ── */
  float ca=length(uv)*.010;
  color.r+=ca*.5; color.b-=ca*.3;

  gl_FragColor=vec4(color,1.);
}
    `;

    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime:       { value: 0.0 },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uMouse:      { value: new THREE.Vector2(0,0) },
        uCameraZ:    { value: 0.0 },
        uClickTime:  { value: -999.0 },
        uEnvMap:     { value: envTex },
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
      fragmentShader: frag,
    });

    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat));

    const STATUS = ['PULSING','BREATHING','CONTRACTING','SECRETING','ABSORBING','METABOLIZING','REPLICATING'];
    const NEURAL  = ['NOMINAL','ALERT','SURGING','LATENT','FIRING','CASCADING','DORMANT'];
    const sStatus = document.getElementById('s-status');
    const sDepth  = document.getElementById('s-depth');
    const sNeural = document.getElementById('s-neural');
    const sPress  = document.getElementById('s-press');

    function animate(){
      requestAnimationFrame(animate);
      const now=performance.now()*.001;
      state.currentZ+=(state.targetZ-state.currentZ)*.07;
      mat.uniforms.uTime.value      = now;
      mat.uniforms.uMouse.value.copy(state.mouse);
      mat.uniforms.uCameraZ.value   = state.currentZ;
      mat.uniforms.uClickTime.value = state.clickTime;
      sDepth.textContent  = (state.currentZ*13.8).toFixed(2);
      sStatus.textContent = STATUS[Math.floor(now*.32)%STATUS.length];
      sNeural.textContent = NEURAL[Math.floor(now*.21+3)%NEURAL.length];
      sPress.textContent  = (Math.sin(now*1.28)*11+46).toFixed(2);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize',()=>{
      renderer.setSize(window.innerWidth, window.innerHeight);
      mat.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
