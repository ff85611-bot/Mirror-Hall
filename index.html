<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>血管隧道探索 — Mirror Hall</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      overflow: hidden;
      background: #000;
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #hud { 
      position: fixed; 
      inset: 0; 
      pointer-events: none; 
      z-index: 100; 
      font-family: "Courier New", "Chalkboard SE", "Microsoft JhengHei", monospace; 
    }
    #panel { 
      position: absolute; 
      top: calc(28px + env(safe-area-inset-top, 0px)); 
      left: calc(28px + env(safe-area-inset-left, 0px)); 
      color: #aa1a00; 
      font-size: 11px;
      letter-spacing: 2px; 
      line-height: 2.4; 
      text-shadow: 0 0 12px #ff0000aa; 
      max-width: 60vw;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .lbl {
      color: #3d0800;
    }

    .val {
      color: #ff3300;
    }

    .div-line {
      width: 220px;
      height: 1px;
      background: linear-gradient(90deg, #3d0800, transparent);
      margin: 6px 0;
    }

    #hint {
      position: absolute;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      right: calc(28px + env(safe-area-inset-right, 0px));
      color: #330700;
      font-size: 9px;
      letter-spacing: 2px;
      text-align: right;
      line-height: 2;
    }

    /* ── 手機窄螢幕：縮小字級與邊距，避免版面爆版 ── */
    @media (max-width: 480px) {
      #panel {
        top: calc(14px + env(safe-area-inset-top, 0px));
        left: calc(14px + env(safe-area-inset-left, 0px));
        font-size: 9px;
        line-height: 2.1;
        max-width: 78vw;
      }
      .div-line { width: 150px; }
      #hint {
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        right: calc(14px + env(safe-area-inset-right, 0px));
        font-size: 7px;
      }
      #control-feedback {
        bottom: calc(54px + env(safe-area-inset-bottom, 0px));
        font-size: 8px;
      }
      .tut-row {
        width: min(88vw, 360px);
        font-size: 10px;
        line-height: 1.65;
      }
    }

    @media (pointer: coarse) {
      body { cursor: none; }
    }

    #flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(180, 20, 0, .22) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .05s;
    }

    #flash.active {
      opacity: 1;
      transition: none;
    }

    /* ── 操作狀態提示：不分左右區，不放虛擬搖桿 ── */
    body.dragging { cursor: grabbing; }

    #control-feedback {
      position: absolute;
      left: 50%;
      bottom: calc(74px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 8px);
      padding: 8px 13px;
      border: 1px solid rgba(255, 55, 20, .25);
      background: rgba(12, 0, 0, .58);
      color: #ff5a32;
      font-size: 10px;
      letter-spacing: 2px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
      text-shadow: 0 0 10px rgba(255, 0, 0, .5);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    #control-feedback.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ── 首次進入的操作教學：依裝置顯示觸控或滑鼠版本 ── */
    #tutorial {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(0, 0, 0, .78);
      z-index: 40;
      opacity: 1;
      pointer-events: none;
      transition: opacity .4s ease;
    }

    #tutorial.hide { opacity: 0; }

    #tutorial-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .tut-row {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #c9603a;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .tut-icon {
      width: 30px;
      text-align: center;
      font-size: 18px;
      color: #ff3300;
      text-shadow: 0 0 10px rgba(255, 0, 0, .55);
    }

    .tut-sub {
      margin-top: 6px;
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(180, 90, 60, .6);
    }

    #xhair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
    }

    #xhair::before,
    #xhair::after {
      content: '';
      position: absolute;
      background: rgba(200, 30, 0, .45);
    }

    #xhair::before {
      width: 1px;
      height: 24px;
      left: 11px;
      top: 0;
    }

    #xhair::after {
      width: 24px;
      height: 1px;
      top: 11px;
      left: 0;
    }

    #xhair-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      border: 1px solid rgba(200, 30, 0, .4);
      border-radius: 50%;
      animation: pr 2.2s ease-in-out infinite;
    }

    @keyframes pr {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: .5;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.8);
        opacity: .08;
      }
    }

    /* 後置覆寫，確保手機尺寸設定不被前面的基礎樣式蓋掉 */
    @media (max-width: 480px) {
      #control-feedback {
        bottom: calc(54px + env(safe-area-inset-bottom, 0px));
        font-size: 8px;
      }
      .tut-row {
        width: min(88vw, 360px);
        font-size: 10px;
        line-height: 1.65;
      }
    }
  </style>
</head>

<body>
  <div id="hud">
    <div id="panel">
      <div class="row"><span class="lbl">有機載體</span><span class="val" id="s-status">搏動</span></div>
      <div class="row"><span class="lbl">閾界深度</span><span class="val" id="s-depth">0.00</span><span class="lbl">μm</span></div>
      <div class="row"><span class="lbl">擬神經叢</span><span class="val" id="s-neural">微瀾</span></div>
      <div class="row"><span class="lbl">流體內壓</span><span class="val" id="s-press">48.33</span><span class="lbl">kPa</span></div>
      <div class="div-line"></div>
      <div class="row"><span class="lbl">自動推進</span><span class="val" id="s-auto">:: 關閉</span></div>
      <div class="row"><span class="lbl">前進速率</span><span class="val" id="s-speed">:: 1.00×</span></div>
      <div class="row"><span class="lbl">視域尋跡</span><span class="val">:: 任意處拖曳</span></div>
      <div class="row"><span class="lbl">速率調節</span><span class="val">:: 捏合／滾輪</span></div>
    </div>
    <div id="hint">意識深淵<br>血管隧道探索<br>單手直覺控制</div>
    <div id="xhair"><div id="xhair-ring"></div></div>
    <div id="control-feedback">自動前進：關閉</div>
  </div>

  <div id="tutorial">
    <div id="tutorial-content"></div>
    <div class="tut-sub">不分左右區・不需持續按住前進</div>
  </div>
  <div id="flash"></div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    // 手機（觸控裝置）GPU較弱，這個shader每個像素要跑95次光線步進，
    // 全解析度容易掉幀、發燙、讓觸控回饋看起來「卡卡的不直覺」，故降低內部解析度
    const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isCoarsePointer ? 0.75 : 1.0));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    /* ── Load env texture from external file (keep env.jpg next to this HTML) ── */
    const envTex = new THREE.TextureLoader().load('env.jpg');
    envTex.wrapS = envTex.wrapT = THREE.RepeatWrapping;
    envTex.minFilter = THREE.LinearMipmapLinearFilter;

    const BASE_FORWARD_SPEED = 2.4;
    const MIN_FORWARD_SPEED = BASE_FORWARD_SPEED * 0.25;
    const MAX_FORWARD_SPEED = BASE_FORWARD_SPEED * 3.0;

    const state = {
      mouse: new THREE.Vector2(0, 0),
      mouseTarget: new THREE.Vector2(0, 0),
      targetZ: 0,
      currentZ: 0,
      clickTime: -999.0,
      autoForward: false,
      forwardSpeed: BASE_FORWARD_SPEED,
    };

    const flash = document.getElementById('flash');
    const tutorial = document.getElementById('tutorial');
    const tutorialContent = document.getElementById('tutorial-content');
    const controlFeedback = document.getElementById('control-feedback');
    const sAuto = document.getElementById('s-auto');
    const sSpeed = document.getElementById('s-speed');
    const isTouch = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;

    tutorialContent.innerHTML = isTouch
      ? `
        <div class="tut-row"><span class="tut-icon">☝</span><span>單指拖曳（任何位置）：轉頭環顧</span></div>
        <div class="tut-row"><span class="tut-icon">●</span><span>點一下：切換自動前進 開／關</span></div>
        <div class="tut-row"><span class="tut-icon">⇔</span><span>雙指展開加速、捏合減速</span></div>`
      : `
        <div class="tut-row"><span class="tut-icon">↔</span><span>按住滑鼠拖曳：轉頭環顧</span></div>
        <div class="tut-row"><span class="tut-icon">●</span><span>點一下或按空白鍵：切換自動前進</span></div>
        <div class="tut-row"><span class="tut-icon">↕</span><span>滑鼠滾輪：調整前進速度</span></div>`;

    function smoothTo(current, target, rate, dt) {
      const t = 1 - Math.exp(-rate * dt);
      return current + (target - current) * t;
    }

    function triggerFlash() {
      state.clickTime = performance.now() * .001;
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 80);
    }

    let feedbackTimer = 0;
    function showFeedback(text, hold = false) {
      controlFeedback.textContent = text;
      controlFeedback.classList.add('show');
      clearTimeout(feedbackTimer);
      if (!hold) {
        feedbackTimer = setTimeout(() => controlFeedback.classList.remove('show'), 900);
      }
    }

    function speedRatio() {
      return state.forwardSpeed / BASE_FORWARD_SPEED;
    }

    function updateControlHud() {
      sAuto.textContent = state.autoForward ? ':: 開啟' : ':: 關閉';
      sSpeed.textContent = `:: ${speedRatio().toFixed(2)}×`;
    }

    function setForwardSpeed(nextSpeed, announce = true) {
      state.forwardSpeed = Math.max(MIN_FORWARD_SPEED, Math.min(MAX_FORWARD_SPEED, nextSpeed));
      updateControlHud();
      if (announce) showFeedback(`前進速度：${speedRatio().toFixed(2)}×`);
    }

    function toggleAutoForward() {
      state.autoForward = !state.autoForward;
      updateControlHud();
      triggerFlash();
      showFeedback(`自動前進：${state.autoForward ? '開啟' : '關閉'}`);
    }

    function dismissTutorial() {
      tutorial.classList.add('hide');
    }
    setTimeout(dismissTutorial, 7000);
    updateControlHud();

    // 拖過整個螢幕寬／高所對應的旋轉量。
    const LOOK_DEG_PER_FULL_WIDTH = 110;
    const LOOK_DEG_PER_FULL_HEIGHT = 90;
    function addLookDelta(dx, dy) {
      const sx = (LOOK_DEG_PER_FULL_WIDTH / 180) / window.innerWidth;
      const sy = (LOOK_DEG_PER_FULL_HEIGHT / 180) / window.innerHeight;
      state.mouseTarget.x = Math.max(-1, Math.min(1, state.mouseTarget.x + dx * sx));
      state.mouseTarget.y = Math.max(-1, Math.min(1, state.mouseTarget.y - dy * sy));
    }

    /* ── 桌面：拖曳環顧、點擊切換自動前進、滾輪調速 ── */
    const mouseGesture = {
      active: false,
      startX: 0,
      startY: 0,
      lastX: 0,
      lastY: 0,
      startTime: 0,
      moved: false,
    };

    window.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      dismissTutorial();
      mouseGesture.active = true;
      mouseGesture.startX = mouseGesture.lastX = e.clientX;
      mouseGesture.startY = mouseGesture.lastY = e.clientY;
      mouseGesture.startTime = performance.now();
      mouseGesture.moved = false;
      document.body.classList.add('dragging');
    });

    window.addEventListener('mousemove', e => {
      if (!mouseGesture.active) return;
      const dx = e.clientX - mouseGesture.lastX;
      const dy = e.clientY - mouseGesture.lastY;
      if (Math.hypot(e.clientX - mouseGesture.startX, e.clientY - mouseGesture.startY) > 5) {
        mouseGesture.moved = true;
      }
      addLookDelta(dx, dy);
      mouseGesture.lastX = e.clientX;
      mouseGesture.lastY = e.clientY;
    });

    function endMouseGesture(e) {
      if (!mouseGesture.active) return;
      mouseGesture.active = false;
      document.body.classList.remove('dragging');
      const elapsed = performance.now() - mouseGesture.startTime;
      if (!mouseGesture.moved && elapsed < 350 && (!e || e.button === 0)) {
        toggleAutoForward();
      }
    }
    window.addEventListener('mouseup', endMouseGesture);
    window.addEventListener('blur', () => {
      mouseGesture.active = false;
      document.body.classList.remove('dragging');
    });

    window.addEventListener('wheel', e => {
      e.preventDefault();
      dismissTutorial();
      const multiplier = Math.exp(-e.deltaY * 0.0015);
      setForwardSpeed(state.forwardSpeed * multiplier);
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        dismissTutorial();
        toggleAutoForward();
      } else if (e.code === 'ArrowUp' || e.key === '+') {
        e.preventDefault();
        setForwardSpeed(state.forwardSpeed * 1.12);
      } else if (e.code === 'ArrowDown' || e.key === '-') {
        e.preventDefault();
        setForwardSpeed(state.forwardSpeed / 1.12);
      }
    });

    /* ── 手機／平板：整個畫面皆可拖曳；點一下切換；雙指捏合調速 ── */
    const touchGesture = {
      mode: 'none', // none | look | pinch | blocked
      primaryId: null,
      startX: 0,
      startY: 0,
      lastX: 0,
      lastY: 0,
      startTime: 0,
      moved: false,
      pinchStartDistance: 0,
      pinchStartSpeed: BASE_FORWARD_SPEED,
    };

    function touchDistance(a, b) {
      return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }

    function beginSingleTouch(t, blockTap = false) {
      touchGesture.mode = blockTap ? 'blocked' : 'look';
      touchGesture.primaryId = t.identifier;
      touchGesture.startX = touchGesture.lastX = t.clientX;
      touchGesture.startY = touchGesture.lastY = t.clientY;
      touchGesture.startTime = performance.now();
      touchGesture.moved = blockTap;
    }

    function beginPinch(touches) {
      touchGesture.mode = 'pinch';
      touchGesture.primaryId = null;
      touchGesture.moved = true;
      touchGesture.pinchStartDistance = Math.max(20, touchDistance(touches[0], touches[1]));
      touchGesture.pinchStartSpeed = state.forwardSpeed;
      showFeedback(`前進速度：${speedRatio().toFixed(2)}×`, true);
    }

    window.addEventListener('touchstart', e => {
      e.preventDefault();
      dismissTutorial();
      if (e.touches.length >= 2) {
        beginPinch(e.touches);
      } else if (e.touches.length === 1) {
        beginSingleTouch(e.touches[0]);
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length >= 2) {
        if (touchGesture.mode !== 'pinch') beginPinch(e.touches);
        const dist = touchDistance(e.touches[0], e.touches[1]);
        // 展開加速、捏合減速；指距每改變約 160px，速率約乘上 e。
        const nextSpeed = touchGesture.pinchStartSpeed * Math.exp((dist - touchGesture.pinchStartDistance) / 160);
        setForwardSpeed(nextSpeed, false);
        showFeedback(`前進速度：${speedRatio().toFixed(2)}×`, true);
        return;
      }

      if (e.touches.length === 1 && touchGesture.mode === 'look') {
        const t = e.touches[0];
        if (t.identifier !== touchGesture.primaryId) return;
        const dx = t.clientX - touchGesture.lastX;
        const dy = t.clientY - touchGesture.lastY;
        if (Math.hypot(t.clientX - touchGesture.startX, t.clientY - touchGesture.startY) > 5) {
          touchGesture.moved = true;
        }
        addLookDelta(dx, dy);
        touchGesture.lastX = t.clientX;
        touchGesture.lastY = t.clientY;
      }
    }, { passive: false });

    window.addEventListener('touchend', e => {
      e.preventDefault();

      if (touchGesture.mode === 'pinch' || touchGesture.mode === 'blocked') {
        controlFeedback.classList.remove('show');
        if (e.touches.length === 0) {
          touchGesture.mode = 'none';
        } else {
          // 雙指操作後仍留一指時，不讓剩餘手指被誤判成點擊。
          beginSingleTouch(e.touches[0], true);
        }
        return;
      }

      if (touchGesture.mode === 'look') {
        const endedPrimary = Array.from(e.changedTouches).some(t => t.identifier === touchGesture.primaryId);
        if (endedPrimary) {
          const elapsed = performance.now() - touchGesture.startTime;
          if (!touchGesture.moved && elapsed < 350) toggleAutoForward();
          touchGesture.mode = e.touches.length ? 'blocked' : 'none';
        }
      }
    }, { passive: false });

    window.addEventListener('touchcancel', () => {
      touchGesture.mode = 'none';
      controlFeedback.classList.remove('show');
    }, { passive: true });

    /* ════════════════════════════════════════════════════════════
       FRAGMENT SHADER — Mirror Hall Environment Integration
    ════════════════════════════════════════════════════════════ */
    const frag = `
precision highp float;
uniform float      uTime;
uniform vec2       uResolution;
uniform vec2       uMouse;
uniform float      uCameraZ;
uniform float      uClickTime;
uniform sampler2D  uEnvMap;
varying vec2       vUv;

#define PI 3.14159265359
#define TWO_PI 6.28318530718

/* ── MATH ─────────────────────────────────────────────────── */
mat2 rot2(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }

/* ── NOISE ────────────────────────────────────────────────── */
float hash(float n){ return fract(sin(n)*43758.5453); }
float hash2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec3 p){
  vec3 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float n=i.x+i.y*57.+113.*i.z;
  return mix(mix(mix(hash(n),hash(n+1.),f.x),mix(hash(n+57.),hash(n+58.),f.x),f.y),
             mix(mix(hash(n+113.),hash(n+114.),f.x),mix(hash(n+170.),hash(n+171.),f.x),f.y),f.z);
}
float fbm(vec3 p){ return vnoise(p)*.5+vnoise(p*2.01)*.25+vnoise(p*4.03)*.125; }

/* ── ENV MAP SAMPLING ─────────────────────────────────────── */
/* Equirectangular spherical projection on direction vector d  */
vec3 sampleEnv(vec3 d){
  vec3 dn = normalize(d);
  /* Slight time-driven rotation to animate reflections */
  dn.xz *= rot2(uTime * 0.018);
  float u = atan(dn.z, dn.x) / TWO_PI + 0.5;
  float v = acos(clamp(dn.y, -1.0, 1.0)) / PI;
  vec3 col = texture2D(uEnvMap, vec2(u, v)).rgb;
  return col;
}

/* ── GLOBALS ──────────────────────────────────────────────── */
vec3 g_ro, g_fwd;
float pulse(float t){ return pow(max(0., sin(t*2.18)), 3.); }

/* ── MOUSE / CLICK FIELD ─────────────────────────────────── */
float mouseField(vec3 p){
  vec3  dp   = p - g_ro;
  float proj = max(0., dot(dp, g_fwd));
  float dist = length(dp - g_fwd*proj);
  float suction = exp(-dist*dist*1.3)*0.72;
  float ripple  = 0.;
  float dt = uTime - uClickTime;
  if(dt>0. && dt<4.8){
    float front = dt*5.0;
    float wd    = abs(dist-front);
    ripple = exp(-wd*wd*2.2)*exp(-dt*.9)*sin(dist*5.5-dt*10.)*1.5;
  }
  return suction+ripple;
}

/* ── SDF ─────────────────────────────────────────────────── */
float map(vec3 p){
  float t=uTime;
  float warp=fbm(vec3(p.xy*.14,p.z*.06+t*.045));
  vec3 tp=p;
  tp.xy+=vec2(sin(p.z*.22+t*.11)*1.65+sin(p.z*.08)*.85,
              cos(p.z*.17+t*.09)*1.42+cos(p.z*.12)*.72);
  tp.xy*=rot2(p.z*.088+t*.021);
  float breathe=sin(t*1.28)*.38+sin(t*2.18+.75)*.19;
  float bump=fbm(vec3(tp.xy*.52,p.z*.13+t*.032))*.52;

  // ─── 關鍵機制：設定隧道的盡頭深度 ───
  float tunnelEnd = 150.0; // 這是出口的深度座標，數值越小越快走到盡頭
  // 當 p.z 進入 (tunnelEnd - 30.0) 到 tunnelEnd 的區間時，數值會從 0 平滑過渡到 1
  float openUp = smoothstep(tunnelEnd - 30.0, tunnelEnd, p.z); 

  // 計算基礎管壁半徑，並在接近盡頭時，將半徑急遽放大到 100.0，形成「出口」
  float baseRadius = 5.75+breathe+warp*.52+bump;
  float finalRadius = mix(baseRadius, 100.0, openUp);
  float tunnel = finalRadius - length(tp.xy);

  // 讓內部的血管與障礙球體，隨著接近出口而逐漸萎縮消失
  float obstacleScale = 1.0 - openUp;

  float blobs=99.;
  for(int i=0;i<3;i++){
    float fi=float(i), ph=fi*2.094;
    float lz=mod(p.z-fi*8.2,18.)-9.;
    vec2 bxy=vec2(sin(p.z*.25+ph+t*.21)*1.85,cos(p.z*.19+ph+t*.17)*1.60);
    // 乘上 obstacleScale，抵達盡頭時半徑歸零
    float blobR = (0.50+sin(t*1.55+ph)*.16) * obstacleScale; 
    blobs=smin(blobs, length(vec3(p.xy-bxy,lz))-blobR, 1.15);
  }
  float veins=99.;
  for(int i=0;i<3;i++){
    float fi=float(i);
    float ang=p.z*.10+fi*2.094+t*.036;
    vec2 vc=vec2(cos(ang),sin(ang))*4.35+vec2(sin(p.z*.18+fi)*.4,cos(p.z*.14+fi+1.)*.3);
    // 同樣乘上 obstacleScale
    float veinR = (0.20+sin(t*1.85+fi*2.1+p.z*.25)*.065) * obstacleScale;
    veins=smin(veins, length(p.xy-vc)-veinR, 0.55);
  }
  return smin(smin(tunnel,blobs,1.45),veins,0.80)-mouseField(p);
}

/* ── NORMAL ───────────────────────────────────────────────── */
vec3 calcNormal(vec3 p){
  const float e=0.004;
  return normalize(vec3(
    map(p+vec3(e,0,0))-map(p-vec3(e,0,0)),
    map(p+vec3(0,e,0))-map(p-vec3(0,e,0)),
    map(p+vec3(0,0,e))-map(p-vec3(0,0,e))));
}

/* ── SHADING — Environment-Integrated ────────────────────── */
vec3 shade(vec3 p, vec3 N, vec3 V, vec3 rd, float depth){
  float t=uTime;

  /* ── Organic surface colour ── */
  float cn1=fbm(p*.21);
  float cn2=fbm(p*.46+vec3(3.1,7.4,2.2));
  float cn3=fbm(p*.9 +vec3(1.3,0.5,5.7));
  vec3 col=mix(vec3(.38,.01,.01),vec3(.10,.03,.20),cn1);
  col=mix(col,vec3(.04,.16,.03),cn2*.28);
  col+=vec3(.14,.0,.0)*pulse(t);

  /* ── Env-map reflection ── */
  vec3 R = reflect(rd, N);
  /* Add procedural micro-ripple to reflection vector (mucus shiver) */
  float rippleMag = 0.06 + 0.04*sin(t*3.2 + p.z*.8);
  R.xy += vec2(fbm(p*.8+t*.18), fbm(p*.8+t*.18+vec3(5.))) * rippleMag;
  R = normalize(R);
  vec3 envCol = sampleEnv(R);

  /* Redness tint: environment adopts the organic colour temperature */
  envCol = mix(envCol, envCol * vec3(1.6, 0.4, 0.3), 0.6);

  /* ── Fresnel (Schlick) — controls how mirror-like the surface is ── */
  float cosTheta = max(0., dot(N, V));
  float F0       = 0.18;                       /* base reflectivity */
  float fresnel  = F0 + (1.0-F0)*pow(1.0-cosTheta, 4.0);
  /* Wet organic boost: veiny areas more reflective */
  fresnel *= (1.0 + cn1*.4);

  /* ── Direct lighting from env image (sample env at light dir) ── */
  vec3 L = normalize(vec3(sin(t*.42)*2., cos(t*.35), -1.25));
  float NdL = max(0., dot(N, -L));
  /* Env-sampled diffuse: bleed the red corridor into the tissue */
  vec3 envDiff = sampleEnv(-L) * 1.4;

  /* ── Specular ── */
  vec3  H    = normalize(-L + V);
  float NdH  = max(0., dot(N, H));
  vec3 specCol = vec3(1.,.65,.50)*pow(NdH,90.)*3.5
               + vec3(.5,.1,.06)*pow(NdH,12.)*.9;

  /* ── Subsurface scattering ── */
  float sss = pow(max(0., -dot(V, N)), 5.5);
  vec3 sssCol = vec3(.70,.02,.0)*sss*.55;

  /* ── Rim ── */
  float rim = pow(1.-max(0.,dot(N,V)), 4.2);
  vec3 rimCol = vec3(.90,.18,.02)*rim*.70*(0.5+0.5*pulse(t));
  /* Rim picks up env colour (red corridor edge glow) */
  rimCol += sampleEnv(R)*rim*.25;

  /* ── Ambient occlusion ── */
  float ao = 0.3 + 0.7*(clamp(map(p+N*.35)/.35,0.,1.)*.6
                       +clamp(map(p+N*.80)/.80,0.,1.)*.4);
  ao = ao*ao;

  /* ── Combine: diffuse + env reflection (Fresnel weighted) ── */
  vec3 diffuse  = col * (envDiff * NdL * 1.4 + vec3(.04,.0,.01)*0.3);
  vec3 reflect_ = envCol * fresnel * 2.2;

  return (diffuse + reflect_ + sssCol)*ao + specCol + rimCol;
}

/* ── MAIN ─────────────────────────────────────────────────── */
void main(){
  vec2 uv=(vUv-.5)*2.; uv.x*=uResolution.x/uResolution.y;

  /* Camera */
  vec3 ro=vec3(0.,0.,uCameraZ); g_ro=ro;
  vec3 rd=normalize(vec3(uv,1.3));
  rd.xz*=rot2(uMouse.x*3.14159);
  rd.yz*=rot2(uMouse.y*1.22);
  g_fwd=vec3(0.,0.,1.);
  g_fwd.xz*=rot2(uMouse.x*3.14159);
  g_fwd.yz*=rot2(uMouse.y*1.22);

  /* ── Raymarch ── */
  float t=0.05; vec3 p; bool hit=false;
  for(int i=0;i<95;i++){
    p=ro+rd*t;
    float d=map(p);
    if(abs(d)<0.005){ hit=true; break; }
    if(t>58.) break;
    t+=d*.52;
  }

  vec3 color=vec3(0.);

  if(hit){
    vec3 N=calcNormal(p);
    color=shade(p,N,-rd,rd,t);

    /* ── Organic fog mixed with env-image colour ── */
    /* Sample env in the forward direction for fog tint */
    vec3 fogEnv = sampleEnv(rd) * 0.35;
    vec3 fogCol  = mix(vec3(.055,.0,.022), fogEnv, .55);
    float fogAmt = 1.-exp(-t*.042);
    color=mix(color, fogCol, fogAmt);

    /* ── Vignette ── */
    float vig=smoothstep(.90,.05,length(vUv-.5)*2.);
    color*=.35+.65*vig;

    /* ── Near-surface tissue glow ── */
    float glow=exp(-abs(map(p+N*.1))*8.)*.07;
    color+=vec3(.55,.04,.02)*glow*pulse(uTime);

  } else {
    /* ── Sky: pure spherical env-map projection on rd ── */
    vec3 envBg = sampleEnv(rd);
    /* Darken towards edges for depth illusion */
    float edgeDark = 1.0 - length(uv)*.28;
    envBg *= edgeDark * 1.6;
    /* Subtle pulsing heat-glow at the vanishing point */
    float axialDot = max(0., dot(normalize(rd), g_fwd));
    envBg += vec3(.15,.01,.0)*pow(axialDot, 8.0)*(0.6+0.4*pulse(uTime));
    color = envBg;
  }

  /* ── Film grain ── */
  color += (hash2(vUv+fract(uTime*.09))-.5)*.020;

  /* ── ACES tone map ── */
  color=color*(2.51*color+.03)/(color*(2.43*color+.59)+.14);
  color=clamp(color,0.,1.);

  /* ── Slight desaturation (aged flesh) ── */
  float lum=dot(color,vec3(.299,.587,.114));
  color=mix(color,vec3(lum),.07);

  /* ── Chromatic aberration (edges) ── */
  float ca=length(uv)*.010;
  color.r+=ca*.5; color.b-=ca*.3;

  gl_FragColor=vec4(color,1.);
}
    `;

    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uMouse: { value: new THREE.Vector2(0, 0) },
        uCameraZ: { value: 0.0 },
        uClickTime: { value: -999.0 },
        uEnvMap: { value: envTex },
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
      fragmentShader: frag,
    });

    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

    const STATUS = ['搏動', '吐納', '攣縮', '滲流', '吞噬', '嬗變', '裂殖'];
    const NEURAL = ['微瀾', '驚蟄', '狂湧', '蟄伏', '灼燒', '崩裂', '寂滅'];
    const sStatus = document.getElementById('s-status');
    const sDepth = document.getElementById('s-depth');
    const sNeural = document.getElementById('s-neural');
    const sPress = document.getElementById('s-press');

    let lastFrameMs = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const nowMs = performance.now();
      const dt = Math.min(.05, (nowMs - lastFrameMs) / 1000); // 秒，clamp避免分頁切走後跳一大格
      lastFrameMs = nowMs;
      const now = nowMs * .001;
      if (state.autoForward) state.targetZ += state.forwardSpeed * dt; // 點一下後持續自動前進，不必一直按住
      state.currentZ = smoothTo(state.currentZ, state.targetZ, 6, dt);
      state.mouse.x = smoothTo(state.mouse.x, state.mouseTarget.x, 10, dt); // 視角平滑：不會因單一觸控樣本雜訊瞬間跳動
      state.mouse.y = smoothTo(state.mouse.y, state.mouseTarget.y, 10, dt);
      mat.uniforms.uTime.value = now;
      mat.uniforms.uMouse.value.copy(state.mouse);
      mat.uniforms.uCameraZ.value = state.currentZ;
      mat.uniforms.uClickTime.value = state.clickTime;
      sDepth.textContent = (state.currentZ * 13.8).toFixed(2);
      sStatus.textContent = STATUS[Math.floor(now * .32) % STATUS.length];
      sNeural.textContent = NEURAL[Math.floor(now * .21 + 3) % NEURAL.length];
      sPress.textContent = (Math.sin(now * 1.28) * 11 + 46).toFixed(2);
      renderer.render(scene, camera);
    }
    animate();

    function handleResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      mat.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', handleResize);
    // 手機轉向、或網址列出現/消失導致的視窗尺寸變化，補上這兩個監聽會更準確
    window.addEventListener('orientationchange', () => setTimeout(handleResize, 300));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', handleResize);
    }
  </script>
